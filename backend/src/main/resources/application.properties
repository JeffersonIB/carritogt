# =====================================================================
#  CarritoGT API - configuracion comun (sin credenciales)
# =====================================================================
spring.application.name=carritogt-api
server.port=${PORT:8080}

# Perfil por defecto: MySQL/MariaDB (requisito RNF-08).
# Para una demostracion sin MySQL: --spring.profiles.active=h2
spring.profiles.default=mysql

# Configuracion local del equipo (contrasenas, URL). Este archivo NO se sube a Git.
# Copie config/application-local.properties.example como config/application-local.properties

# JPA / Hibernate
# - Se respetan los nombres exactos de tablas y columnas del script original (idProducto, codUsuario...).
# - ddl-auto=none: el esquema lo crea el script SQL provisto, Hibernate no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# CORS: origenes permitidos cuando el frontend se sirve desde OTRO servidor
# (por ejemplo, Apache con el VirtualHost carrito-compra.localhost).
app.cors.allowed-origins=${CORS_ORIGINS:http://carrito-compra.localhost,http://localhost:5500}

logging.level.com.carritogt=INFO
