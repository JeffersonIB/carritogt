# =====================================================================
#  Perfil "mysql": persistencia en MySQL / MariaDB (base de datos "cc")
#  Los valores reales se leen de variables de entorno o de
#  config/application-local.properties (excluido de Git).
# =====================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:carritogt}
spring.datasource.password=${DB_PASSWORD:}

# El esquema y los datos los aporta el script SQL del catedratico (database/cc.sql)
spring.sql.init.mode=never
spring.config.import=optional:file:./config/application-local.properties
