# =====================================================================
#  Perfil "h2": base de datos en memoria para demostracion y pruebas.
#  Reproduce las mismas 2 tablas del script original (producto, shopping_cart).
#  Los datos se pierden al detener la aplicacion.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:cc;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/schema.sql
spring.sql.init.data-locations=classpath:db/h2/data.sql

# Consola web de H2: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:cc)
spring.h2.console.enabled=true
